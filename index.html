* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 Georgia, "Times New Roman", serif; }
header { padding: 18px 16px 10px; max-width: 900px; margin: 0 auto; }
header .k { font: 600 11px/1.2 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }
h1 { margin: 4px 0 2px; font-size: 26px; }
#who { color: var(--mute); font-style: italic; }
#summary { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 6px 16px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; font: 12px system-ui, sans-serif; }
#summary a { text-decoration: none; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); }
#summary a.ok { color: var(--ok); } #summary a.warn { color: var(--warn); border-color: var(--warn); }
main { max-width: 900px; margin: 0 auto; padding: 8px 16px 60px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 14px 0; scroll-margin-top: 50px; }
section.todo { border-color: var(--acc); }
h2 { font: 700 14px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; color: var(--acc); }
h3 { font: 700 12px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 6px 0; }
.help { color: var(--mute); font-size: 14px; margin: 6px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 14px; }
.fld { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.fld.wide { grid-column: 1 / -1; }
.fld > span { font: 600 12px system-ui, sans-serif; color: var(--mute); }
.fld small { color: var(--mute); font-size: 12px; }
input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
.cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 18px; margin: 8px 0; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted var(--line); gap: 8px; }
.row > span { font-size: 15px; }
.dots { display: inline-flex; gap: 4px; align-items: center; flex-shrink: 0; }
.dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--dot); background: transparent; padding: 0; cursor: pointer; }
.dot.on { background: var(--dot); }
.clr { border: none; background: none; color: var(--mute); cursor: pointer; font-size: 15px; padding: 0 2px; }
.line { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.line select { width: auto; max-width: 160px; }
.line .grow { flex: 1 1 180px; }
.line .num { width: 64px; flex: 0 0 64px; }
.line .note { flex-basis: 100%; color: var(--mute); font-size: 12px; }
.free { font: 12px system-ui, sans-serif; color: var(--mute); display: flex; align-items: center; gap: 3px; }
.free input { width: auto; }
button { font: 600 14px system-ui, sans-serif; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 7px 12px; cursor: pointer; }
button.rm { font-size: 12px; padding: 5px 8px; color: var(--mute); }
button.add { margin-top: 4px; }
button.primary { background: var(--acc); color: #fff; border-color: var(--acc); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.andrew { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--mute); }
.andrew input { width: auto; }
.chk { margin-top: 10px; font: 13px system-ui, sans-serif; }
.chk .ok { color: var(--ok); } .chk .warn { color: var(--warn); }
#status.ok { color: var(--ok); } #status.warn { color: var(--warn); }
#status { font: 14px system-ui, sans-serif; min-height: 1em; }
details { margin-top: 10px; font-size: 14px; }
summary { cursor: pointer; color: var(--acc); font: 600 13px system-ui, sans-serif; }
.ref { line-height: 1.6; }
.derived { font: 600 14px system-ui, sans-serif; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.pick a { display: block; padding: 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: bold; }
.pick small { display: block; font-weight: normal; color: var(--mute); }
a { color: var(--acc); }
footer { text-align: center; color: var(--mute); font: 12px system-ui, sans-serif; padding: 0 16px 30px; }

    tribe: "", auspice: "", patron: "", renown: { Glory: 0, Honor: 0, Wisdom: 0 }, gifts: { native: "", auspice: "", tribe: "" }, rite: "",
    creed: "", drive: "", redemption: "", edges: [], notes: "", andrew: {} };
}
function load() {
  let base;
  if (PCS[pcId]) base = Object.assign(blank(PCS[pcId].splat), clone(PCS[pcId]));
  else if (["vampire", "werewolf", "hunter"].includes(pcId)) base = blank(pcId);
  else return null;
  base.andrew = base.andrew || {}; base.notes = base.notes || "";
  try {
    const d = localStorage.getItem(KEY());
    if (d) { const saved = JSON.parse(d); if (saved && saved.splat === base.splat) { saved.open = base.open; return saved; } }
  } catch (e) {}
  return base;
}
function save() { try { localStorage.setItem(KEY(), JSON.stringify(S)); } catch (e) {} }

// ---------------------------------------------------------------- checks
function countBy(vals) { const c = {}; vals.forEach(v => c[v] = (c[v] || 0) + 1); return c; }
function sig(arr) { return arr.slice().sort((a, b) => b - a).join(","); }
const STD_ATTR = [4, 3, 3, 3, 2, 2, 2, 2, 1];
function attrOK() {
  const v = ATTRS.flat().map(a => +S.attrs[a] || 0);
  if (sig(v) === sig(STD_ATTR)) return [true, "One 4, three 3s, four 2s, one 1"];
  if (S.autonomous) {
    const ok = new Set();
    for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) if (i !== j) {
      const t = STD_ATTR.slice(); t[i]--; t[j]++;
      if (t[i] >= 1 && t[j] <= 4 && t.filter(x => x === 4).length === 1) ok.add(sig(t));
    }
    if (ok.has(sig(v))) return [true, "Standard spread with one dot moved (Autonomous Learner)"];
    return [false, "With Autonomous Learner you place the standard spread (one 4, three 3s, four 2s, one 1) and move one dot. Exactly one 4, nothing at 5, nothing below 1"];
  }
  return [false, "Needs one 4, three 3s, four 2s and one 1. You have " + sig(v).replace(/,/g, " ")];
}
function skillVals() { return SKILLS.flat().map(k => +S.skills[k] || 0).filter(x => x > 0); }
function skillOK() {
  const d = DISTS[S.skillDist]; const v = skillVals(); const c = countBy(v); const tot = v.reduce((a, b) => a + b, 0);
  const want = Object.entries(d.shape).sort((a, b) => b[0] - a[0]).map(([k, n]) => `${n}×${k}`).join(", ");
  const have = [5, 4, 3, 2, 1].filter(k => c[k]).map(k => `${c[k]}×${k}`).join(", ") || "none";
  if (!S.autonomous) {
    const ok = [5, 4, 3, 2, 1].every(k => (c[k] || 0) === (d.shape[k] || 0));
    return [ok, ok ? `${d.label}. ${want}` : `${d.label} needs ${want}. You have ${have}`];
  }
  const errs = [];
  if (tot !== d.total) errs.push(`total dots must stay ${d.total}, you have ${tot}`);
  if ((c[5] || 0) > 0) errs.push("no 5s");
  const hi = (c[3] || 0) + (c[4] || 0), hiMax = (d.shape[3] || 0) + (d.shape[4] || 0);
  if (hi > hiMax) errs.push(`no more than ${hiMax} Skills at 3 or 4`);
  if (S.skillDist === "specialist" && (c[4] || 0) !== 1) errs.push("Specialist keeps its one Skill at 4");
  if (S.skillDist === "balanced" && (c[3] || 0) !== 3) errs.push("Balanced keeps exactly three 3s");
  if (S.skillDist === "jack" && (c[1] || 0) < 10) errs.push("Jack of all trades keeps at least ten 1s");
  if ((c[4] || 0) > (d.shape[4] || 0)) errs.push("no new 4s");
  return [errs.length === 0, errs.length ? "Autonomous Learner. " + errs.join("; ") : `${d.label}, reshaped by Autonomous Learner. ${tot} dots. ${have}`];
}
function specAllowance() {
  const need = NEEDS_SPECIALTY.filter(k => (+S.skills[k] || 0) > 0);
  let n = 1 + need.length, parts = ["1 free"];
  if (need.length) parts.push(`${need.length} for ${need.join(", ")}`);
  if (S.splat === "vampire" && S.predator) { n++; parts.push("1 from your predator type"); }
  if (S.autonomous) { n++; parts.push("1 from Autonomous Learner"); }
  return [n, parts.join(" + "), need];
}
function specOK() {
  const [n, why, need] = specAllowance();
  const used = S.specs.filter(s => s.skill && s.text.trim()).length;
  const missing = need.filter(k => !S.specs.some(s => s.skill === k && s.text.trim()));
  const bad = S.specs.filter(s => s.skill && s.text.trim() && !(+S.skills[s.skill] > 0)).map(s => s.skill);
  const msgs = [`${used} of ${n} (${why})`];
  if (missing.length) msgs.push(`${missing.join(", ")} still needs its own`);
  if (bad.length) msgs.push(`no dots in ${bad.join(", ")}`);
  return [used === n && !missing.length && !bad.length, msgs.join(". ")];
}
function advTotals() {
  const pay = S.advantages.filter(a => !a.free && a.kind !== "flaw").reduce((t, a) => t + (+a.dots || 0), 0);
  const fl = S.advantages.filter(a => !a.free && a.kind === "flaw").reduce((t, a) => t + (+a.dots || 0), 0);
  const extra = Math.max(0, fl - 2);
  const bonus = extra >= 3 ? 2 : extra === 2 ? 1 : 0;
  return { pay, fl, extra, bonus, budget: 7 + bonus };
}
function advOK() {
  const t = advTotals(); const msgs = []; let ok = true;
  if (t.pay !== t.budget) { ok = false; msgs.push(`Advantages ${t.pay} of ${t.budget}`); } else msgs.push(`Advantages ${t.pay} of ${t.budget}`);
  if (t.fl < 2) { ok = false; msgs.push(`Flaws ${t.fl} of at least 2, not counting free ones`); } else msgs.push(`Flaws ${t.fl}`);
  if (t.extra > 3) { ok = false; msgs.push("house rule caps extra Flaws at 3"); }
  if (t.extra === 1) msgs.push("one extra Flaw buys nothing on its own. A second one buys an Advantage point");
  return [ok, msgs.join(". ")];
}
function touchOK() {
  const n = S.touchstones.filter(t => (t.name || "").trim()).length;
  return [n >= 1 && n <= 3, `${n} of 1 to 3`];
}
function renownOK() {
  const r = S.renown; const tr = (W5_TRIBE[S.tribe] || {}).renown;
  const tot = r.Glory + r.Honor + r.Wisdom;
  if (!tr) return [false, "Pick a tribe first"];
  const others = ["Glory", "Honor", "Wisdom"].filter(k => k !== tr);
  const ok = r[tr] === 2 && tot === 3 && others.some(k => r[k] === 1);
  return [ok, ok ? `Total Renown 3. That’s what Gifts check` : `${tr} 2 for your tribe, then 1 in ${others.join(" or ")}. You have Total ${tot}`];
}
function giftOK() {
  const g = S.gifts; const n = ["native", "auspice", "tribe"].filter(k => g[k]).length;
  return [n === 3 && !!S.rite, `${n} of 3 Gifts, ${S.rite ? "Rite chosen" : "no Rite yet"}`];
}
function discOK() {
  const tot = S.disciplines.reduce((t, d) => t + (+d.dots || 0), 0);
  const pw = S.disciplines.reduce((t, d) => t + (d.powers || "").split(",").filter(x => x.trim()).length, 0);
  return [tot === 4 && pw === tot, `${tot} dots of 4 (two clan Disciplines at 2 and 1, plus 1 from your predator type). ${pw} powers, one per dot`];
}
function edgeOK() {
  const e = S.edges.filter(x => x.kind === "Edge" && x.name.trim()).length, p = S.edges.filter(x => x.kind === "Perk" && x.name.trim()).length;
  return [(e === 2 && p === 0) || (e === 1 && p === 2), `${e} Edge${e === 1 ? "" : "s"}, ${p} Perk${p === 1 ? "" : "s"}. Take two Edges, or one Edge and two Perks`];
}
function checks() {
  const L = [["Attributes", ...attrOK()], ["Skills", ...skillOK()], ["Specialties", ...specOK()], ["Advantages and Flaws", ...advOK()], ["Touchstones", ...touchOK()]];
  if (S.splat === "vampire") L.splice(3, 0, ["Disciplines", ...discOK()]);
  if (S.splat === "werewolf") L.splice(3, 0, ["Renown", ...renownOK()], ["Gifts and Rite", ...giftOK()]);
  if (S.splat === "hunter") L.splice(3, 0, ["Edges and Perks", ...edgeOK()]);
  return L;
}

// ---------------------------------------------------------------- render helpers
function dotsInput(path, val, max = 5, min = 0) {
  let h = `<span class="dots" data-path="${path}" role="group">`;
  for (let i = 1; i <= max; i++) h += `<button type="button" class="dot${i <= val ? " on" : ""}" data-v="${i}" aria-label="${i}"></button>`;
  return h + `<button type="button" class="clr" data-v="${min}" title="Clear">×</button></span>`;
}
function field(label, path, val, opts = {}) {
  const id = "f-" + path.replace(/\W/g, "_");
  const inp = opts.area ? `<textarea id="${id}" data-path="${path}" rows="${opts.rows || 2}" placeholder="${esc(opts.ph || "")}">${esc(val)}</textarea>`
    : opts.options ? `<select id="${id}" data-path="${path}"><option value="">Choose…</option>${opts.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${v === val ? " selected" : ""}>${esc(l)}</option>`; }).join("")}</select>`
    : `<input id="${id}" data-path="${path}" value="${esc(val)}" placeholder="${esc(opts.ph || "")}"${opts.list ? ` list="${opts.list}"` : ""}>`;

  let h = "";

  if (S.splat === "hunter") h += secEdges();
  h += secAdv() + secTouch() + secExtra();
  h += `<section class="send"><h2>Send it to Andrew</h2><div id="status"></div><div class="btns"><button type="button" class="primary" id="send">Email my sheet to Andrew</button><button type="button" id="copy">Copy as text</button><button type="button" id="reset">Start over from Andrew’s copy</button></div><p class="help">Your answers are saved in this browser as you go, so you can close the page and come back.</p><textarea id="out" readonly rows="10" hidden></textarea></section>`;
  app.innerHTML = h;
  update();
}
function update() {
  const L = checks(); const map = { Attributes: "attrs", Skills: "skills", Specialties: "specs", "Advantages and Flaws": "adv", Touchstones: "touch", Disciplines: "disc", Renown: "renown", "Gifts and Rite": "renown", "Edges and Perks": "edges" };
  document.querySelectorAll(".chk").forEach(c => c.innerHTML = "");
  L.forEach(([name, ok, msg]) => { const c = document.querySelector(`.chk[data-chk="${map[name]}"]`); if (c) c.innerHTML += `<div class="${ok ? "ok" : "warn"}">${ok ? "✓" : "!"} <b>${name}.</b> ${esc(msg)}</div>`; });
  const sumEl = $("#summary");
  sumEl.innerHTML = L.map(([n, ok]) => `<a href="#sec-${map[n]}" class="${ok ? "ok" : "warn"}">${ok ? "✓" : "!"} ${n}</a>`).join("");
  const d = $("#derived"); if (d) d.textContent = `Health ${(+S.attrs.Stamina || 0) + 3}${S.splat === "werewolf" ? " (plus 4 in crinos)" : ""} · Willpower ${(+S.attrs.Composure || 0) + (+S.attrs.Resolve || 0)}`;
  save();
}
function setPath(path, val) {
  const parts = path.split("."); let o = S;
  while (parts.length > 1) o = o[parts.shift()];
  o[parts[0]] = val;
}
function numberish(path, v) { return ["bp", "humanity"].includes(path) ? v : v; }

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest(".dots") && t.dataset.v !== undefined) {
    const g = t.closest(".dots"); const v = +t.dataset.v; setPath(g.dataset.path, v);
    g.querySelectorAll(".dot").forEach(b => b.classList.toggle("on", +b.dataset.v <= v)); update(); return;
  }
  const lists = { addspec: ["specs", { skill: "", text: "" }], adddisc: ["disciplines", { name: "", dots: 1, powers: "" }], addadv: ["advantages", { name: "", dots: 1, kind: "merit" }], addtouch: ["touchstones", { name: "", conviction: "" }], addedge: ["edges", { kind: "Perk", name: "" }] };
  if (lists[t.id]) { S[lists[t.id][0]].push(clone(lists[t.id][1])); rerenderKeep(); return; }
  for (const [attr, key] of [["rmspec", "specs"], ["rmdisc", "disciplines"], ["rmadv", "advantages"], ["rmtouch", "touchstones"], ["rmedge", "edges"]]) {
    if (t.dataset[attr] !== undefined) { S[key].splice(+t.dataset[attr], 1); rerenderKeep(); return; }
  }
  if (t.id === "copy") { const txt = sheetText(); const o = $("#out"); o.hidden = false; o.value = txt; o.select(); try { navigator.clipboard.writeText(txt); status("Copied. Paste it to Andrew on Discord or by email.", "ok"); } catch (er) { status("Select the text below and copy it.", "warn"); } return; }
  if (t.id === "reset") { if (confirm("Throw away your changes and reload Andrew’s copy?")) { try { localStorage.removeItem(KEY()); } catch (er) {} S = load(); render(); } return; }
  if (t.id === "send") { send(); return; }
});
function rerenderKeep() { const y = scrollY; render(); scrollTo(0, y); }
document.addEventListener("input", e => {
  const t = e.target; const ds = t.dataset;
  if (ds.path) { setPath(ds.path, t.type === "checkbox" ? t.checked : t.value); if (["tribe", "auspice", "autonomous", "predator"].includes(ds.path) && e.type === "input") { if (t.tagName === "SELECT" || t.type === "checkbox") { if (ds.path === "tribe" && W5_TRIBE[t.value] && W5_TRIBE[t.value].patron) S.patron = W5_TRIBE[t.value].patron; rerenderKeep(); return; } } update(); return; }
  if (ds.andrew) { S.andrew[ds.andrew] = t.checked; update(); return; }
  if (ds.extra !== undefined) { S.extra[+ds.extra][1] = t.value; update(); return; }
  const m = { spec: "specs", disc: "disciplines", adv: "advantages", touch: "touchstones", edge: "edges" };
  for (const k in m) if (ds[k] !== undefined) { const it = S[m[k]][+ds[k]]; it[ds.f] = t.type === "checkbox" ? t.checked : t.type === "number" ? +t.value : t.value; update(); return; }
});
document.addEventListener("change", e => { if (e.target.dataset.path === "skillDist") { setPath("skillDist", e.target.value); update(); } });

// ---------------------------------------------------------------- output
function sheetText() {
  const L = []; const dots = n => "●".repeat(n) || "0";
  L.push(`${S.name} · ${S.player} · ${SPLATS[S.splat].game}`, "");
  L.push(`Concept. ${S.concept}`, `Ambition. ${S.ambition}`, `Desire. ${S.desire}`);
  if (S.splat === "vampire") L.push(`Clan ${S.clan} · ${S.generation} Generation · Blood Potency ${S.bp} · Predator ${S.predator} · Sire ${S.sire} · Humanity ${S.humanity}`);
  if (S.splat === "werewolf") L.push(`Tribe ${S.tribe} · Auspice ${S.auspice || "?"} · Patron ${S.patron}`);
  if (S.splat === "hunter") L.push(`Creed ${S.creed} · Drive ${S.drive}`, `Redemption. ${S.redemption}`);
  L.push("", "ATTRIBUTES" + (S.autonomous ? " (Autonomous Learner)" : ""));
  ATTRS.forEach((g, i) => L.push(`${ATTR_GROUPS[i]}. ` + g.map(a => `${a} ${S.attrs[a]}`).join(", ")));
  L.push(`Health ${+S.attrs.Stamina + 3} · Willpower ${+S.attrs.Composure + +S.attrs.Resolve}`);
  L.push("", `SKILLS (${DISTS[S.skillDist].label})`);
  SKILLS.forEach((g, i) => { const s = g.filter(k => +S.skills[k] > 0).map(k => `${k} ${S.skills[k]}`); if (s.length) L.push(`${ATTR_GROUPS[i]}. ${s.join(", ")}`); });
  L.push("Specialties. " + (S.specs.filter(s => s.skill).map(s => `${s.skill} (${s.text})`).join(", ") || "none"));
  if (S.splat === "vampire") L.push("", "DISCIPLINES", ...S.disciplines.map(d => `${d.name} ${d.dots}. ${d.powers}`));
  if (S.splat === "werewolf") {
    L.push("", `RENOWN. Glory ${S.renown.Glory}, Honor ${S.renown.Honor}, Wisdom ${S.renown.Wisdom}`);
    L.push(`GIFTS. Native ${S.gifts.native || "?"} · Auspice ${S.gifts.auspice || "?"} · Tribe ${S.gifts.tribe || "?"}`, `RITE. ${S.rite || "?"}`);
  }
  if (S.splat === "hunter") L.push("", "EDGES AND PERKS", ...S.edges.map(e => `${e.kind}. ${e.name}`));
  const t = advTotals();
  L.push("", `ADVANTAGES (${t.pay} of ${t.budget}) AND FLAWS (${t.fl})`, ...S.advantages.map(a => `${a.name} ${dots(+a.dots)}${a.free ? " (free)" : ""}`));
  L.push("", S.splat === "vampire" ? "CONVICTIONS AND TOUCHSTONES" : "TOUCHSTONES", ...S.touchstones.map(x => (x.conviction ? x.conviction + " → " : "") + x.name));
  const ex = (S.extra || []).filter(e => e[1]); if (ex.length) L.push("", "LOOSE ENDS", ...ex.map(e => `${e[0]} ${e[1]}`));
  const ad = Object.keys(S.andrew).filter(k => S.andrew[k]); if (ad.length) L.push("", "ANDREW CAN DECIDE. " + ad.join(", "));
  if (S.notes) L.push("", "NOTES", S.notes);
  L.push("", "CHECKS", ...checks().map(([n, ok, m]) => `${ok ? "✓" : "!"} ${n}. ${m}`));
  return L.join("\n");
}
function status(msg, cls) { const s = $("#status"); s.className = cls; s.textContent = msg; }
async function send() {
  const txt = sheetText(); const btn = $("#send"); btn.disabled = true; status("Sending…", "");
  try {
    const r = await fetch("https://formsubmit.co/ajax/" + SEND_TO, {
      method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ _subject: `Wizard’s Tower sheet · ${S.name} (${S.player})`, _template: "box", Character: S.name, Player: S.player, Sheet: txt, Data: JSON.stringify(S) }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && String(j.success) === "true") status("Sent. Andrew has it. You can still change things and send again.", "ok");
    else throw new Error(j.message || "The form service said no");
  } catch (er) {
    const o = $("#out"); o.hidden = false; o.value = txt;
    status("That didn’t go through (" + er.message + "). Use “Copy as text” and send it to Andrew on Discord instead.", "warn");
  }
  btn.disabled = false;
}

S = load(); render();

</script>
</body>
